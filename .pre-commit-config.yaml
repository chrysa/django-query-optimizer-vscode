repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-json
  - id: check-toml
  - id: check-added-large-files
    args:
    - --maxkb=1024
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: mixed-line-ending
  - id: detect-private-key
  - args:
    - --branch
    - main
    id: no-commit-to-branch
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args:
    - --baseline
    - .secrets.baseline
    exclude: package.lock.json|yarn.lock|pnpm-lock.yaml
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
    args:
    - --strict
    - --force-scope
    - feat
    - fix
    - chore
    - docs
    - refactor
    - test
    - ci
    - build
    - perf
- repo: https://github.com/adrienverge/yamllint
  rev: v1.38.0
  hooks:
  - id: yamllint
    args:
    - -d
    - '{extends: default, rules: {line-length: disable, document-start: disable}}'
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint
    files: ^\.github/workflows/.*\.ya?ml$
- repo: https://github.com/chrysa/pre-commit-tools
  rev: v0.2.0-253
  hooks:
  - id: makefile-check
  - id: adr-gate
  - id: console-log-detection
  - id: console-debug-detection
  - id: no-console-warn
  - id: ts-unreachable-code
  - id: regression-gate
    stages:
    - pre-push
  - exclude: ^(\.github/|workflows/|templates/)
    id: yaml-sorter
  - id: json-sorter
  - id: env-file-check
  - id: env-example-sync
  - id: react-console-error-detection
  - id: import-no-relative-parent
  - id: claude-skill-frontmatter
  - id: claude-agent-frontmatter
  - id: claude-mcp-config
  - id: python-no-unittest-import
  - id: claude-assets-present
  - id: python-untyped-raise
    exclude: ^tests?/
  - id: python-mutable-default
  - id: python-dispatch-ladder
  - id: debugger-detection
    exclude: ^(tests?/|README\.md|docs/)
  - id: python-print-detection
    exclude: ^(tests?/|README\.md|docs/)
  - id: python-pprint-detection
    exclude: ^(tests?/|README\.md|docs/)
  - id: no-bare-except
  - id: python-logger-detection
    exclude: ^(tests?/|README\.md|docs/)
  - id: python-unreachable-code
  - id: no-hardcoded-localhost
    exclude: tests?/|\.test\.|\.spec\.
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - args:
    - --fix
    id: markdownlint
    stages:
    - manual
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.0
  hooks:
  - id: gitleaks
- repo: https://github.com/chrysa/guideline-checker
  rev: v1.31.0-13
  hooks:
  - id: guideline-check
